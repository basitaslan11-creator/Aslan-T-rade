<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İlan Ver | ASLAN TRADE</title>

<style>
    body{
        font-family:Arial,sans-serif;
        background:#f3f4f6;
        margin:0;
    }

    header{
        background:#111827;
        color:white;
        text-align:center;
        padding:20px;
    }

    header h1{
        margin:0;
    }

    header p{
        margin:8px 0 0;
    }

    .form{
        max-width:600px;
        margin:40px auto;
        background:white;
        padding:25px;
        border-radius:10px;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    label{
        display:block;
        font-weight:bold;
        margin-top:10px;
    }

    input, textarea, select{
        width:100%;
        padding:12px;
        margin-top:10px;
        margin-bottom:20px;
        border:1px solid #ccc;
        border-radius:6px;
        box-sizing:border-box;
        font-size:15px;
    }

    button{
        width:100%;
        padding:14px;
        background:#2563eb;
        color:white;
        border:none;
        border-radius:6px;
        font-size:16px;
        cursor:pointer;
    }

    button:hover{
        background:#1d4ed8;
    }

    .geri{
        display:block;
        text-align:center;
        margin-top:20px;
        color:#2563eb;
        text-decoration:none;
    }

    .bilgi{
        text-align:center;
        color:#555;
        margin-bottom:20px;
    }
</style>

</head>

<body>

<header>
    <h1>🦁 ASLAN TRADE</h1>
    <p>İlan Ver</p>
</header>

<div class="form">

```
<h2>İlanınızı Yayınlayın</h2>

<p class="bilgi">
    Satmak veya hizmet vermek istediğiniz ürünün bilgilerini girin.
</p>

<label>Adınız</label>
<input type="text" placeholder="Adınız Soyadınız">

<label>İlan Başlığı</label>
<input type="text" placeholder="Örneğin: 2020 Model Ford Transit">

<label>Kategori</label>
<select>
    <option value="">Kategori Seçin</option>
    <option>İş Makinesi</option>
    <option>Araç</option>
    <option>Gayrimenkul</option>
    <option>Usta ve Hizmet</option>
</select>

<label>Fiyat</label>
<input type="number" placeholder="Örneğin: 850000">

<label>Telefon</label>
<input type="tel" placeholder="05XXXXXXXXX">

<label>Açıklama</label>
<textarea rows="6" placeholder="İlanınızı detaylı şekilde yazın..."></textarea>

<button type="button" onclick="ilanGonder()">
    İlanı Gönder
</button>

<a href="index.html" class="geri">
    ← Ana Sayfaya Dön
</a>
```

</div>

<script>
function ilanGonder(){

    alert("İlan bilgileriniz alındı. Yakında yayınlanacaktır.");

}
</script>

</body>
</html>
