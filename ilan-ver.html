<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İlan Ver - ASLAN TRADE</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0 0 15px;
}

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

nav a{
    color:white;
    text-decoration:none;
    background:#1f2937;
    padding:9px 12px;
    border-radius:6px;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:0 15px;
}

.form-box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
}

.form-box h2{
    text-align:center;
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:16px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

.foto-bilgi{
    margin-top:8px;
    color:#666;
    font-size:13px;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:7px;
    background:#f59e0b;
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#d97706;
}

#sonuc{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

footer{
    margin-top:40px;
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<header>

<h1>🦁 ASLAN TRADE</h1>

<nav>
<a href="index.html">Ana Sayfa</a>
<a href="ilanlar.html">İlanlar</a>
<a href="ilan-ver.html">📢 İlan Ver</a>
<a href="hizmetler.html">Hizmetler</a>
<a href="ustaol.html">Usta Ol</a>
</nav>

</header>


<div class="container">

<div class="form-box">

<h2>📢 İlan Ver</h2>

<form id="ilanForm">

<label>Adınız</label>

<input
type="text"
id="ad"
placeholder="Adınız ve soyadınız"
required
>


<label>Telefon Numaranız</label>

<input
type="tel"
id="telefon"
placeholder="053XXXXXXXX"
required
>


<label>İlan Başlığı</label>

<input
type="text"
id="baslik"
placeholder="Örn: 2015 Ford Transit"
required
>


<label>Kategori</label>

<select id="kategori" required>

<option value="">Kategori seçin</option>
<option value="Araç">🚗 Araç</option>
<option value="İş Makinesi">🚜 İş Makinesi</option>
<option value="Gayrimenkul">🏠 Gayrimenkul</option>
<option value="Diğer">📦 Diğer</option>

</select>


<label>Fiyat</label>

<input
type="number"
id="fiyat"
placeholder="Örn: 600000"
required
>


<label>Açıklama</label>

<textarea
id="aciklama"
placeholder="İlanınız hakkında bilgi yazın..."
required
></textarea>


<label>📷 İlan Fotoğrafı</label>

<input
type="file"
id="foto"
accept="image/*"
>

<div class="foto-bilgi">
Fotoğraf seçebilirsiniz. Fotoğraf şu an sadece bu cihazda seçilir; henüz internete yüklenmez.
</div>


<button type="submit">
📢 İlanı Yayınla
</button>

</form>

<div id="sonuc"></div>

</div>

</div>


<footer>

© 2026 ASLAN TRADE

</footer>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCi8EdXncxji-CBvwRakQhtuLeLlcD-HCs",

    authDomain: "aslan-trade.firebaseapp.com",

    projectId: "aslan-trade",

    storageBucket: "aslan-trade.firebasestorage.app",

    messagingSenderId: "908993990043",

    appId: "1:908993990043:web:0b52daf9f1b6ed8ed7653e",

    measurementId: "G-XVTTPW6KDF"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


document
.getElementById("ilanForm")
.addEventListener("submit", async function(e){

    e.preventDefault();


    const ad =
        document.getElementById("ad").value.trim();

    const telefon =
        document.getElementById("telefon").value.trim();

    const baslik =
        document.getElementById("baslik").value.trim();

    const kategori =
        document.getElementById("kategori").value;

    const fiyat =
        document.getElementById("fiyat").value.trim();

    const aciklama =
        document.getElementById("aciklama").value.trim();


    if(
        !ad ||
        !telefon ||
        !baslik ||
        !kategori ||
        !fiyat ||
        !aciklama
    ){

        document.getElementById("sonuc").innerHTML =
        "⚠️ Lütfen tüm alanları doldurun.";

        return;
    }


    try{

        await addDoc(
            collection(db,"ilanlar"),
            {

                Ad:ad,

                Telefon:telefon,

                Başlık:baslik,

                Kategori:kategori,

                fiyat:fiyat,

                Açıklama:aciklama,

                Tarih:new Date()
                .toLocaleString("tr-TR")

            }
        );


        let whatsappNumara =
            telefon.replace(/\D/g,"");


        if(whatsappNumara.startsWith("0")){

            whatsappNumara =
                "90" +
                whatsappNumara.substring(1);

        }else if(
            !whatsappNumara.startsWith("90")
        ){

            whatsappNumara =
                "90" +
                whatsappNumara;

        }


        const mesaj =
`Merhaba, ASLAN TRADE'ye yeni bir ilan verildi.

İlan: ${baslik}
Kategori: ${kategori}
Fiyat: ${fiyat} TL
Açıklama: ${aciklama}
Telefon: ${telefon}`;


        const whatsappLink =
        `https://wa.me/905396305613?text=${encodeURIComponent(mesaj)}`;


        document.getElementById("sonuc").innerHTML =
        `
        <div style="
        background:#dcfce7;
        color:#166534;
        padding:15px;
        border-radius:8px;
        ">

        ✅ İlan başarıyla yayınlandı.

        <br><br>

        <a
        href="${whatsappLink}"
        target="_blank"
        style="
        display:inline-block;
        background:#25D366;
        color:white;
        padding:12px 18px;
        border-radius:7px;
        text-decoration:none;
        font-weight:bold;
        "
        >
        💬 WhatsApp'a Gönder
        </a>

        </div>
        `;


        document
        .getElementById("ilanForm")
        .reset();


    }catch(hata){

        console.error(hata);

        document.getElementById("sonuc").innerHTML =
        "❌ İlan kaydedilirken bir hata oluştu.";

    }

});

</script>

</body>
</html>
