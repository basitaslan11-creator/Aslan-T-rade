import {
    getFirestore,
    collection,
    addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


window.ilanGonder = async function(){

    let ad = document.getElementById("ad").value.trim();

    let telefon =
        document.getElementById("telefon").value.trim();

    let baslik =
        document.getElementById("baslik").value.trim();

    let kategori =
        document.getElementById("kategori").value;

    let fiyat =
        document.getElementById("fiyat").value.trim();

    let aciklama =
        document.getElementById("aciklama").value.trim();


    if(
        ad === "" ||
        telefon === "" ||
        baslik === "" ||
        kategori === "" ||
        fiyat === "" ||
        aciklama === ""
    ){

        alert("Lütfen bütün alanları doldurun.");

        return;
    }


    try{

        await addDoc(
            collection(db, "ilanlar"),
            {

                Ad: ad,

                Telefon: telefon,

                Başlık: baslik,

                Kategori: kategori,

                fiyat: fiyat,

                Açıklama: aciklama,

                Tarih: new Date().toLocaleString("tr-TR")

        );


        let mesaj =
        "🦁 ASLAN TRADE İLAN BAŞVURUSU\n\n" +

        "📂 Kategori: " + kategori + "\n" +
        "💰 Fiyat: " + fiyat + "\n" +
        "📝 Açıklama: " + aciklama;


        let numara = "905396305613";


        let url =
        "https://wa.me/" +
        numara +
        "?text=" +
        encodeURIComponent(mesaj);


        alert(
            "İlanınız başarıyla kaydedildi. WhatsApp açılıyor."
        );


        window.open(url, "_blank");


        document.getElementById("ad").value = "";

        document.getElementById("telefon").value = "";

        document.getElementById("baslik").value = "";

        document.getElementById("kategori").value = "";

        document.getElementById("fiyat").value = "";

        document.getElementById("aciklama").value = "";


    }catch(hata){

        console.error(hata);

        alert(
            "İlan kaydedilirken bir hata oluştu. " +
            "Lütfen tekrar deneyin."
        );

    }

}
