<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İlan Ver | ASLAN TRADE</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:8px 0 0;
}

.form{
    max-width:600px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.form h2{
    text-align:center;
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    margin-top:8px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:7px;
    box-sizing:border-box;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:7px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.geri{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
}

</style>
</head>

<body>

<header>

<h1>🦁 ASLAN TRADE</h1>

<p>Ücretsiz İlan Ver</p>

</header>


<div class="form">

<h2>İlan Bilgileri</h2>


<label>Adınız Soyadınız</label>

<input
type="text"
id="ad"
placeholder="Adınız Soyadınız"
>


<label>İlan Başlığı</label>

<input
type="text"
id="baslik"
placeholder="Örneğin: 2020 Model Ford Transit"
>


<label>Kategori</label>

<select id="kategori">

<option value="">Kategori Seçin</option>

<option value="Araç">Araç</option>

<option value="İş Makinesi">İş Makinesi</option>

<option value="Gayrimenkul">Gayrimenkul</option>

<option value="Usta ve Hizmet">Usta ve Hizmet</option>

<option value="Diğer">Diğer</option>

</select>


<label>Fiyat</label>

<input
type="number"
id="fiyat"
placeholder="Örneğin: 600000"
>


<label>Telefon</label>

<input
type="tel"
id="telefon"
placeholder="05XXXXXXXXX"
>


<label>İlan Açıklaması</label>

<textarea
id="aciklama"
rows="7"
placeholder="İlanınız hakkında detaylı bilgi yazın..."
></textarea>


<button onclick="ilanGonder()">
İlanı Gönder
</button>


<a href="index.html" class="geri">
← Ana Sayfaya Dön
</a>

</div>


<script>

function ilanGonder(){

    const ad = document.getElementById("ad").value;
    const baslik = document.getElementById("baslik").value;
    const kategori = document.getElementById("kategori").value;
    const fiyat = document.getElementById("fiyat").value;
    const telefon = document.getElementById("telefon").value;
    const aciklama = document.getElementById("aciklama").value;


    if(
        ad === "" ||
        baslik === "" ||
        kategori === "" ||
        fiyat === "" ||
        telefon === "" ||
        aciklama === ""
    ){

        alert("Lütfen tüm alanları doldurun.");

        return;

    }


    const mesaj =
        "🦁 ASLAN TRADE YENİ İLAN\n\n" +
        "👤 Ad Soyad: " + ad + "\n" +
        "📌 İlan Başlığı: " + baslik + "\n" +
        "📂 Kategori: " + kategori + "\n" +
        "💰 Fiyat: " + fiyat + " TL\n" +
        "📞 Telefon: " + telefon + "\n" +
        "📝 Açıklama: " + aciklama;


    const whatsappNumara = "905XXXXXXXXX";


    const whatsappLink =
        "https://wa.me/" +
        whatsappNumara +
        "?text=" +
        encodeURIComponent(mesaj);


    window.open(whatsappLink, "_blank");

}

</script>


</body>
</html>
