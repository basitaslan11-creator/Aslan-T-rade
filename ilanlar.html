<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İlanlar | ASLAN TRADE</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
}

nav{
    margin-top:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
    font-weight:bold;
}

nav a:hover{
    color:#60a5fa;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

h2{
    text-align:center;
    margin-bottom:30px;
}

.search{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:30px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.search input{
    width:55%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

.search select{
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    margin-left:5px;
}

.search button{
    padding:12px 20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-left:5px;
}

.ilanlar{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.ilan{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.ilan h3{
    margin-top:0;
}

.kategori{
    color:#2563eb;
    font-weight:bold;
}

.fiyat{
    display:block;
    margin-top:10px;
    font-size:18px;
}

.detay{
    display:block;
    margin-top:10px;
    color:white;
    padding:10px;
    border-radius:6px;
    text-decoration:none;
    text-align:center;
    font-weight:bold;
}

.telefon{
    background:#2563eb;
}

.whatsapp{
    background:#16a34a;
}

.detay-ilan{
    background:#111827;
}

footer{
    margin-top:50px;
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
}

@media(max-width:600px){

    .search input{
        width:100%;
        margin-bottom:10px;
    }

    .search select{
        width:100%;
        margin:0 0 10px 0;
    }

    .search button{
        width:100%;
        margin:0;
    }

    nav a{
        display:inline-block;
        margin:5px;
    }

}

</style>

</head>


<body>


<header>

<h1>🦁 ASLAN TRADE</h1>

<nav>

<a href="index.html">Ana Sayfa</a>

<a href="ilanlar.html">İlanlar</a>

<a href="ilan-ver.html">İlan Ver</a>

<a href="hizmetler.html">Hizmetler</a>

<a href="#">Hakkımızda</a>

<a href="#">İletişim</a>

</nav>

</header>


<div class="container">

<h2>📋 Güncel İlanlar</h2>


<div class="search">

<input
type="text"
id="arama"
placeholder="İlan ara..."
>


<select id="kategori">

<option value="">Tüm Kategoriler</option>

<option value="Araç">🚗 Araç</option>

<option value="İş Makinesi">🚜 İş Makinesi</option>

<option value="Gayrimenkul">🏠 Gayrimenkul</option>

<option value="Diğer">🔧 Diğer</option>

</select>


<button onclick="ilanAra()">
Ara
</button>

</div>


<div
class="ilanlar"
id="ilanListesi"
>

<p>İlanlar yükleniyor...</p>

</div>


</div>


<footer>

© 2026 ASLAN TRADE - Tüm Hakları Saklıdır.

</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCi8EdXncxji-CBvwRakQhtuLeLlcD-HCs",

    authDomain: "aslan-trade.firebaseapp.com",

    projectId: "aslan-trade",

    storageBucket: "aslan-trade.firebasestorage.app",

    messagingSenderId: "908993990043",

    appId: "1:908993990043:web:0b52daf9f1b6ed8ed7653e",

    measurementId: "G-XVTTPW6KDF"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


async function ilanlariGetir(){

    const ilanListesi =
        document.getElementById(
            "ilanListesi"
        );


    ilanListesi.innerHTML =
        "<p>İlanlar yükleniyor...</p>";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "ilanlar"
                )
            );


        ilanListesi.innerHTML = "";


        snapshot.forEach(function(doc){

            const ilan =
                doc.data();


            if(
                !ilan.Başlık ||
                !ilan.Telefon ||
                !ilan.fiyat
            ){

                return;

            }


            const telefon =
                ilan.Telefon || "";


            let whatsappNumara =
                telefon.replace(
                    /\D/g,
                    ""
                );


            if(
                whatsappNumara.startsWith("0")
            ){

                whatsappNumara =
                    "90" +
                    whatsappNumara.substring(1);

            }
            else if(
                !whatsappNumara.startsWith("90")
            ){

                whatsappNumara =
                    "90" +
                    whatsappNumara;

            }


            const mesaj =
                "Merhaba, ASLAN TRADE üzerindeki " +
                (ilan.Başlık || "ilan") +
                " hakkında bilgi almak istiyorum.";


            const whatsappLink =
                "https://wa.me/" +
                whatsappNumara +
                "?text=" +
                encodeURIComponent(mesaj);


            ilanListesi.innerHTML += `

                <div
                    class="ilan"
                    data-kategori="${ilan.Kategori || "Diğer"}"
                >

                    <h3>
                        ${ilan.Başlık || "İlan"}
                    </h3>


                    <p class="kategori">

                        📂
                        ${ilan.Kategori || "Diğer"}

                    </p>


                    <p>
                        ${ilan.Açıklama || ""}
                    </p>


                    <strong class="fiyat">

                        💰 ${ilan.fiyat} TL

                    </strong>


                    <a
                        href="ilan-detay.html?id=${doc.id}"
                        class="detay detay-ilan"
                    >
                        🔎 İlan Detayını Gör
                    </a>


                    <a
                        href="tel:${telefon}"
                        class="detay telefon"
                    >
                        📞 Telefonla Ara
                    </a>


                    <a
                        href="${whatsappLink}"
                        class="detay whatsapp"
                        target="_blank"
                    >
                        💬 WhatsApp'tan Yaz
                    </a>

                </div>

            `;

        });


        if(
            ilanListesi.innerHTML === ""
        ){

            ilanListesi.innerHTML =
                "<p>Henüz yayınlanabilir ilan bulunmuyor.</p>";

        }

    }
    catch(hata){

        console.error(hata);

        ilanListesi.innerHTML =
            "<p>İlanlar yüklenirken bir hata oluştu.</p>";

    }

}


window.ilanAra = function(){

    const arama =
        document
        .getElementById("arama")
        .value
        .toLowerCase()
        .trim();


    const kategori =
        document
        .getElementById("kategori")
        .value;


    const ilanlar =
        document.querySelectorAll(
            ".ilan"
        );


    ilanlar.forEach(function(ilan){

        const metin =
            ilan.innerText.toLowerCase();


        const ilanKategori =
            ilan.dataset.kategori;


        const aramaUygun =
            metin.includes(arama);


        const kategoriUygun =
            kategori === "" ||
            ilanKategori === kategori;


        if(
            aramaUygun &&
            kategoriUygun
        ){

            ilan.style.display =
                "block";

        }
        else{

            ilan.style.display =
                "none";

        }

    });

};


ilanlariGetir();

</script>


</body>

</html>
