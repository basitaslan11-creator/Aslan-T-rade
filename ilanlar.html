<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İlanlar - ASLAN TRADE</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

header{
    background:#111827;
    color:white;
    padding:18px 15px;
    text-align:center;
}

header h1{
    margin:0 0 12px;
    font-size:28px;
}

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

nav a{
    color:white;
    text-decoration:none;
    background:#1f2937;
    padding:9px 13px;
    border-radius:6px;
    font-size:14px;
}

nav a:hover{
    background:#f59e0b;
    color:#111;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.baslik{
    text-align:center;
    margin-bottom:20px;
}

.baslik h2{
    margin-bottom:8px;
}

.filtreler{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.filtreler input,
.filtreler select{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:16px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.10);
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 16px rgba(0,0,0,.15);
}

.card-top{
    background:#111827;
    color:white;
    padding:18px;
}

.card-top h3{
    margin:0 0 8px;
    font-size:20px;
}

.kategori{
    display:inline-block;
    background:#f59e0b;
    color:#111;
    padding:5px 9px;
    border-radius:5px;
    font-size:13px;
    font-weight:bold;
}

.card-body{
    padding:18px;
}

.aciklama{
    color:#555;
    line-height:1.5;
    min-height:45px;
}

.fiyat{
    font-size:23px;
    font-weight:bold;
    color:#16a34a;
    margin:15px 0;
}

.butonlar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.buton{
    display:block;
    text-align:center;
    text-decoration:none;
    padding:11px 8px;
    border-radius:7px;
    font-weight:bold;
    font-size:14px;
}

.detay{
    background:#2563eb;
    color:white;
}

.telefon{
    background:#16a34a;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
    margin-top:8px;
}

.yok{
    background:white;
    padding:30px;
    text-align:center;
    border-radius:10px;
    color:#666;
}

footer{
    margin-top:40px;
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
}

@media(max-width:600px){
    header h1{
        font-size:24px;
    }

    .cards{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>

<h1>🦁 ASLAN TRADE</h1>

<nav>
<a href="index.html">Ana Sayfa</a>
<a href="ilanlar.html">İlanlar</a>
<a href="ilan-ver.html">📢 İlan Ver</a>
<a href="hizmetler.html">Hizmetler</a>
<a href="ustaol.html">Usta Ol</a>
</nav>

</header>

<div class="container">

<div class="baslik">
<h2>📋 Güncel İlanlar</h2>
<p>ASLAN TRADE üzerindeki güncel ilanları inceleyin.</p>
</div>

<div class="filtreler">

<input
type="text"
id="arama"
placeholder="🔎 İlan ara..."
oninput="ilanlariFiltrele()"
>

<select id="kategori" onchange="ilanlariFiltrele()">

<option value="">Tüm Kategoriler</option>
<option value="Araç">🚗 Araç</option>
<option value="İş Makinesi">🚜 İş Makinesi</option>
<option value="Gayrimenkul">🏠 Gayrimenkul</option>
<option value="Diğer">📦 Diğer</option>

</select>

</div>

<div id="ilanlar" class="cards">

<div class="yok">
İlanlar yükleniyor...
</div>

</div>

</div>

<footer>

© 2026 ASLAN TRADE<br>
Türkiye'nin Güvenilir Komisyon ve Ticaret Platformu

</footer>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyCi8EdXncxji-CBvwRakQhtuLeLlcD-HCs",

    authDomain: "aslan-trade.firebaseapp.com",

    projectId: "aslan-trade",

    storageBucket: "aslan-trade.firebasestorage.app",

    messagingSenderId: "908993990043",

    appId: "1:908993990043:web:0b52daf9f1b6ed8ed7653e",

    measurementId: "G-XVTTPW6KDF"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


let tumIlanlar = [];


async function ilanlariGetir(){

    const alan = document.getElementById("ilanlar");

    try{

        const snapshot = await getDocs(
            collection(db,"ilanlar")
        );

        tumIlanlar = [];

        snapshot.forEach((doc)=>{

            const ilan = doc.data();

            if(
                ilan.Başlık &&
                ilan.Telefon &&
                ilan.fiyat
            ){

                tumIlanlar.push({
                    id:doc.id,
                    ...ilan
                });

            }

        });

        ilanlariGoster(tumIlanlar);

    }catch(hata){

        console.error(hata);

        alan.innerHTML = `
        <div class="yok">
        İlanlar yüklenirken bir hata oluştu.
        </div>
        `;

    }

}


function ilanlariGoster(ilanlar){

    const alan = document.getElementById("ilanlar");

    alan.innerHTML = "";

    if(ilanlar.length === 0){

        alan.innerHTML = `
        <div class="yok">
        📭 Aradığınız kriterlere uygun ilan bulunamadı.
        </div>
        `;

        return;
    }


    ilanlar.forEach((ilan)=>{

        const telefon = String(ilan.Telefon);

        let whatsappNumara =
            telefon.replace(/\D/g,"");


        if(whatsappNumara.startsWith("0")){

            whatsappNumara =
                "90" + whatsappNumara.substring(1);

        }else if(!whatsappNumara.startsWith("90")){

            whatsappNumara =
                "90" + whatsappNumara;

        }


        const mesaj =
            `Merhaba, ASLAN TRADE üzerindeki "${ilan.Başlık}" ilanınız hakkında bilgi almak istiyorum.`;

        const whatsappLink =
            `https://wa.me/${whatsappNumara}?text=${encodeURIComponent(mesaj)}`;


        alan.innerHTML += `

        <div class="card">

            <div class="card-top">

                <h3>
                ${ilan.Başlık}
                </h3>

                <span class="kategori">
                ${ilan.Kategori || "Diğer"}
                </span>

            </div>


            <div class="card-body">

                <div class="aciklama">

                ${ilan.Açıklama || "Açıklama bulunmuyor."}

                </div>


                <div class="fiyat">

                ${ilan.fiyat} TL

                </div>


                <div class="butonlar">

                    <a
                    class="buton detay"
                    href="ilan-detay.html?id=${ilan.id}">
                    🔎 Detay
                    </a>


                    <a
                    class="buton telefon"
                    href="tel:${telefon}">
                    📞 Ara
                    </a>

                </div>


                <a
                class="buton whatsapp"
                target="_blank"
                href="${whatsappLink}">
                💬 WhatsApp
                </a>

            </div>

        </div>

        `;

    });

}


window.ilanlariFiltrele = function(){

    const arama =
        document
        .getElementById("arama")
        .value
        .toLowerCase()
        .trim();


    const kategori =
        document
        .getElementById("kategori")
        .value;


    const filtreli =
        tumIlanlar.filter((ilan)=>{

            const baslik =
                String(ilan.Başlık || "")
                .toLowerCase();

            const aciklama =
                String(ilan.Açıklama || "")
                .toLowerCase();

            const kategoriUygun =
                !kategori ||
                ilan.Kategori === kategori;


            const aramaUygun =
                !arama ||
                baslik.includes(arama) ||
                aciklama.includes(arama);


            return kategoriUygun && aramaUygun;

        });


    ilanlariGoster(filtreli);

};


const url =
    new URLSearchParams(window.location.search);

const urlKategori =
    url.get("kategori");


if(urlKategori){

    document.getElementById("kategori").value =
        urlKategori;

}


ilanlariGetir();

</script>

</body>
</html>
