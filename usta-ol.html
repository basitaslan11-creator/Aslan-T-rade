<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usta Ol | ASLAN TRADE</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
}
</style>
</head>

<body>

<header>
<h1>🦁 ASLAN TRADE</h1>
<p>Usta Kayıt Formu</p>
</header>

<div class="container">

<h2>Usta Olarak Kayıt Ol</h2>

<input type="text" placeholder="Ad Soyad">

<input type="tel" placeholder="Telefon Numarası">

<select>
<option>Meslek Seçiniz</option>
<option>Elektrikçi</option>
<option>Boyacı</option>
<option>Sıvacı</option>
<option>Nakliyeci</option>
<option>Dekorasyon</option>
<option>Tesisatçı</option>
<option>Diğer</option>
</select>

<input type="text" placeholder="İl">

<input type="text" placeholder="İlçe">

<input type="number" placeholder="Deneyim (Yıl)">

<textarea rows="5" placeholder="Kendinizi Tanıtın"></textarea>

<button>WhatsApp ile Başvur</button>

</div>

<footer>
© 2026 ASLAN TRADE
</footer>

</body>
</html>
